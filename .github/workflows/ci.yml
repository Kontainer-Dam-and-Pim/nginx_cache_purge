name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      ubuntu: ${{ steps.read.outputs.ubuntu }}
      memory: ${{ steps.read.outputs.memory }}
      memory_ubuntu: ${{ steps.read.outputs.memory_ubuntu }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT/$REF" in
              pull_request/*) base=("$PR_BASE") ;;
              push/*) base=("$BEFORE") ;;
              workflow_dispatch/"refs/heads/$DEFAULT") base=() ;;
              workflow_dispatch/*) base=("$(git merge-base "origin/$DEFAULT" HEAD)") ;;
              *) base=() ;;
          esac
          plan=$(t/ci/nginx_versions.py ci "${base[@]}")
          jq -r '"matrix=\(.matrix | tojson)", "ubuntu=\(.ubuntu | tojson)",
                 "memory=\(.memory)", "memory_ubuntu=\(.memory_ubuntu)",
                 "latest=\(.latest)"' <<<"$plan" >> "$GITHUB_OUTPUT"

  base:
    name: Base image / Ubuntu ${{ matrix.ubuntu }}
    needs: versions
    if: needs.versions.outputs.ubuntu != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ${{ fromJSON(needs.versions.outputs.ubuntu) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: t/Dockerfile
          target: base
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=base-${{ matrix.ubuntu }}
          cache-to: type=gha,scope=base-${{ matrix.ubuntu }},mode=max
          provenance: false

  test:
    name: nginx ${{ matrix.nginx }} / Ubuntu ${{ matrix.ubuntu }}
    needs: [versions, base]
    if: needs.versions.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: t/Dockerfile
          build-args: |
            NGINX_VERSION=${{ matrix.nginx }}
            UBUNTU_VERSION=${{ matrix.ubuntu }}
          tags: ngx-cache-purge-test
          load: true
          cache-from: type=gha,scope=base-${{ matrix.ubuntu }}
          provenance: false
      - name: Struct layouts against this nginx
        run: docker run --rm -v "$PWD:/src" ngx-cache-purge-test t/ci/compat.sh
      - name: Test::Nginx suites
        run: docker run --rm -v "$PWD:/src" ngx-cache-purge-test

  memory:
    name: ${{ matrix.check }} / nginx ${{ needs.versions.outputs.latest }}
    needs: [versions, base]
    if: needs.versions.outputs.memory == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ASan + UBSan
            cc: clang
            sanitize: asan,ubsan
            valgrind: '0'
          - check: Valgrind memcheck
            cc: gcc
            sanitize: ''
            valgrind: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: t/Dockerfile
          build-args: |
            NGINX_VERSION=${{ needs.versions.outputs.latest }}
            UBUNTU_VERSION=${{ needs.versions.outputs.memory_ubuntu }}
            CC=${{ matrix.cc }}
            SANITIZE=${{ matrix.sanitize }}
          tags: ngx-cache-purge-test
          load: true
          cache-from: type=gha,scope=base-${{ needs.versions.outputs.memory_ubuntu }}
          provenance: false
      - name: Test::Nginx suites, failing on any memory error report
        env:
          VALGRIND: ${{ matrix.valgrind }}
        run: docker run --rm -v "$PWD:/src" -e VALGRIND ngx-cache-purge-test

  ci:
    name: CI
    needs: [versions, base, test, memory]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or had nothing to check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result | IN("success", "skipped") | not) | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
              echo "$failed"
              exit 1
          fi
