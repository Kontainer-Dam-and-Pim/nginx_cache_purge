name: Images

on:
  push:
    branches: [master]
    paths:
      - docker/**
      - config
      - ngx_cache_purge_module.c
      - t/nginx-versions.json
      - t/ci/nginx_versions.py
      - .github/workflows/images.yml
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every image, or only the tags not yet published
        type: choice
        options: [missing, all]
        default: missing

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild }}
          BEFORE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
              pull_request) matrix=$(t/ci/nginx_versions.py images all | jq -c 'map(select(.latest))') ;;
              push) matrix=$(t/ci/nginx_versions.py images since "$BEFORE") ;;
              *) matrix=$(t/ci/nginx_versions.py images "$REBUILD") ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  image:
    name: nginx ${{ matrix.nginx }}${{ matrix.variant }}
    needs: versions
    if: needs.versions.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NGINX_VERSION=${{ matrix.nginx }}
            VARIANT=${{ matrix.variant }}
          tags: nginx-cache-purge:smoke
          load: true
          provenance: false
      - name: Smoke test
        run: docker/smoke.sh nginx-cache-purge:smoke
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NGINX_VERSION=${{ matrix.nginx }}
            VARIANT=${{ matrix.variant }}
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=nginx ${{ matrix.nginx }} with ngx_cache_purge
          push: true
          provenance: false
