name: nginx releases

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  bump:
    name: Track nginx releases
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BRANCH: bot/nginx-versions
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply new releases
        id: update
        run: |
          changes=$(t/ci/nginx_versions.py update)
          if [ -z "$changes" ]; then
              echo "nginx.org has nothing newer than t/nginx-versions.json"
              exit 0
          fi
          {
              echo "changes<<EOF"
              echo "$changes"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        if: steps.update.outputs.changes != ''
        env:
          CHANGES: ${{ steps.update.outputs.changes }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git fetch --quiet origin "$BRANCH" 2>/dev/null \
              && git diff --quiet FETCH_HEAD -- t/nginx-versions.json README.md; then
              echo "$BRANCH already carries these versions"
              exit 0
          fi

          summary=${CHANGES//$'\n'/, }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add t/nginx-versions.json README.md
          git commit -m "nginx versions: $summary" -m "$CHANGES"
          git push --force origin "$BRANCH"

          body=$(printf '%s\n\n%s\n%s\n' \
              "nginx.org has released versions CI does not test yet:" \
              "- ${CHANGES//$'\n'/$'\n'- }" \
              "CI builds each one, checks the module's copies of nginx-private structs against its DWARF layout and runs the Test::Nginx suites. A layout mismatch means the struct mirrors in ngx_cache_purge_module.c need a new nginx_version guard before this can merge.")
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
              gh pr edit "$pr" --title "nginx versions: $summary" --body "$body"
          else
              gh pr create --base "$BASE" --head "$BRANCH" \
                  --title "nginx versions: $summary" --body "$body"
          fi
      - name: Merge the pull request once its checks pass
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GATES: ci.yml analysis.yml images.yml
        run: |
          open=$(gh pr list --head "$BRANCH" --state open \
              --json number,headRefOid --jq '.[0] // empty | "\(.number) \(.headRefOid)"')
          if [ -z "$open" ]; then
              echo "no open $BRANCH pull request"
              exit 0
          fi
          read -r pr sha <<<"$open"

          run_of() {
              gh run list --workflow "$1" --commit "$sha" --event workflow_dispatch \
                  --limit 1 --json databaseId,status,conclusion,url --jq '.[0] // empty'
          }

          ids=()
          for gate in $GATES; do
              run=$(run_of "$gate")
              if [ -z "$run" ]; then
                  gh workflow run "$gate" --ref "$BRANCH"
                  for _ in $(seq 30); do
                      sleep 10
                      run=$(run_of "$gate")
                      [ -n "$run" ] && break
                  done
                  if [ -z "$run" ]; then
                      echo "::error::$gate on $sha was dispatched but no run appeared"
                      exit 1
                  fi
              elif [ "$(jq -r .status <<<"$run")" = completed ] \
                  && [ "$(jq -r .conclusion <<<"$run")" != success ]; then
                  echo "::warning::#$pr stays open: $gate failed on $sha, $(jq -r .url <<<"$run")"
                  exit 0
              fi
              ids+=("$(jq -r .databaseId <<<"$run")")
          done

          for id in "${ids[@]}"; do
              gh run watch "$id" --exit-status --interval 30 >/dev/null
          done

          gh pr merge "$pr" --merge --match-head-commit "$sha" --delete-branch
          for gate in $GATES; do
              gh workflow run "$gate" --ref "$BASE"
          done
