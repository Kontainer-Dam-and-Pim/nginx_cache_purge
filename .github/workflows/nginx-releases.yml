name: nginx releases

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  bump:
    name: Track nginx releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      packages: read
      pull-requests: write
    env:
      BRANCH: bot/nginx-versions
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply new releases
        id: update
        run: |
          changes=$(t/ci/nginx_versions.py update)
          if [ -z "$changes" ]; then
              echo "nginx.org has nothing newer than t/nginx-versions.json"
              exit 0
          fi
          {
              echo "changes<<EOF"
              echo "$changes"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        if: steps.update.outputs.changes != ''
        env:
          CHANGES: ${{ steps.update.outputs.changes }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git fetch --quiet origin "$BRANCH" 2>/dev/null \
              && git diff --quiet FETCH_HEAD -- t/nginx-versions.json README.md; then
              echo "$BRANCH already carries these versions"
              exit 0
          fi

          summary=${CHANGES//$'\n'/, }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add t/nginx-versions.json README.md
          git commit -m "nginx versions: $summary" -m "$CHANGES"
          git push --force origin "$BRANCH"

          body=$(printf '%s\n\n%s\n%s\n' \
              "nginx.org has released versions CI does not test yet:" \
              "- ${CHANGES//$'\n'/$'\n'- }" \
              "CI builds each one, checks the module's copies of nginx-private structs against its DWARF layout and runs the Test::Nginx suites. A layout mismatch means the struct mirrors in ngx_cache_purge_module.c need a new nginx_version guard before this can merge.")
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
              gh pr edit "$pr" --title "nginx versions: $summary" --body "$body"
          else
              gh pr create --base "$BASE" --head "$BRANCH" \
                  --title "nginx versions: $summary" --body "$body"
          fi
      - name: Merge the pull request once its checks pass
        id: merge
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GATES: ci.yml analysis.yml images.yml
        run: |
          open=$(gh pr list --head "$BRANCH" --state open \
              --json number,headRefOid --jq '.[0] // empty | "\(.number) \(.headRefOid)"')
          if [ -z "$open" ]; then
              echo "no open $BRANCH pull request"
              exit 0
          fi
          read -r pr sha <<<"$open"

          waiting=false
          for gate in $GATES; do
              run=$(gh run list --workflow "$gate" --commit "$sha" --event workflow_dispatch \
                  --limit 1 --json status,conclusion,url --jq '.[0] // empty')
              if [ -z "$run" ]; then
                  gh workflow run "$gate" --ref "$BRANCH"
                  echo "$gate dispatched on $sha"
                  waiting=true
                  continue
              fi
              IFS='|' read -r status conclusion url < <(jq -r '"\(.status)|\(.conclusion)|\(.url)"' <<<"$run")
              if [ "$status" != completed ]; then
                  echo "$gate on $sha is $status: $url"
                  waiting=true
              elif [ "$conclusion" != success ]; then
                  echo "::warning::#$pr stays open: $gate on $sha ended $conclusion, $url"
                  exit 0
              fi
          done
          if [ "$waiting" = true ]; then
              exit 0
          fi

          gh pr merge "$pr" --merge --match-head-commit "$sha" --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"
          merged=$(gh pr view "$pr" --json mergeCommit --jq .mergeCommit.oid)
          git fetch --quiet origin "$merged" "$sha"
          if [ "$(git rev-parse "$merged^{tree}")" != "$(git rev-parse "$sha^{tree}")" ]; then
              gh workflow run ci.yml --ref "$BASE"
              gh workflow run analysis.yml --ref "$BASE"
          fi
          gh workflow run images.yml --ref "$BASE"
      - name: Publish the images not published yet
        if: steps.merge.outputs.merged != 'true'
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git checkout --quiet --force --detach "$GITHUB_SHA"
          missing=$(t/ci/nginx_versions.py images missing | jq -r 'map(.tag) | join(" ")')
          if [ -z "$missing" ]; then
              echo "every image with a base to build on is published"
              exit 0
          fi
          run=$(gh run list --workflow images.yml --branch "$BASE" --commit "$GITHUB_SHA" \
              --limit 1 --json status,conclusion,url --jq '.[0] // empty')
          if [ -n "$run" ]; then
              IFS='|' read -r status conclusion url < <(jq -r '"\(.status)|\(.conclusion)|\(.url)"' <<<"$run")
              if [ "$status" != completed ]; then
                  echo "images for $missing are being built: $url"
                  exit 0
              fi
              if [ "$conclusion" != success ]; then
                  echo "::warning::not publishing $missing again: Images on $GITHUB_SHA ended $conclusion, $url"
                  exit 0
              fi
          fi
          gh workflow run images.yml --ref "$BASE"
          echo "Images dispatched for $missing"
