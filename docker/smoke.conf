proxy_cache_path /tmp/smoke keys_zone=smoke:1m;

server {
    listen 8080;
    add_header X-Cache $upstream_cache_status;

    location / {
        proxy_pass        http://127.0.0.1:8081;
        proxy_cache       smoke;
        proxy_cache_key   $uri;
        proxy_cache_valid 200 1h;
        proxy_cache_purge PURGE from all;
    }
}

server {
    listen 8081;

    location / {
        return 200 "ok";
    }
}
